version: 2

sources:
  - name: ecom
    database: "{{ env_var('DBT_RAW_PROJECT', target.database) }}"
    schema: "{{ env_var('DBT_RAW_DATASET', 'jaffle_shop_raw') }}"
    description: Jaffle Shop raw ecommerce data.
    tables:
      - name: raw_customers
        identifier: customers2
      - name: raw_orders
        identifier: orders
      - name: raw_items
        identifier: items2
      - name: raw_products
        identifier: products
    config:
      freshness:
        warn_after: {count: 24, period: hour}
      loaded_at_field: ordered_at