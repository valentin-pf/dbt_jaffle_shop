version: 2
models:
  - name: dim_products
    description: Public product data product.
    config:
      access: public
      contract:
        enforced: true
    columns:
      - name: product_id
        data_type: string
        data_tests: [not_null, unique]
      - name: product_name
        data_type: string
      - name: product_type
        data_type: string
      - name: product_price
        data_type: numeric
      - name: product_description
        data_type: string
